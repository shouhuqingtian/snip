name: Review ASR images and rerun native desktop
on:
  push:
    branches: [faster-domestic-asr]
    paths: [.github/workflows/review-asr-fixture.yml]
permissions:
  contents: read
  actions: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: gh run download 41815753403 --repo "$GITHUB_REPOSITORY" --name Targeted-Windows-validation --dir fixture
        env:
          GH_TOKEN: ${{ github.token }}
      - shell: python
        run: |
          import pathlib, base64, json, os
          rows=[]
          for name in ['58-voice-input-settings','59-voice-input-result','60-voice-input-recording']:
              paths=list(pathlib.Path('fixture').rglob(name+'.png'))
              if not paths: continue
              data=base64.b64encode(paths[0].read_bytes()).decode('ascii')
              parts=[data[i:i+3000] for i in range(0,len(data),3000)]
              rows += [f'::notice title=Voice fixture preview {name} {i+1}/{len(parts)}::{part}' for i,part in enumerate(parts)]
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'asr-images.json').write_text(json.dumps(rows))
          for row in rows[:10]: print(row)
          for name in ['voice-input.json','voice-target-performance.json']:
              for p in pathlib.Path('fixture').rglob(name): print('::notice title=Native ASR facts '+name+'::'+p.read_text(encoding='utf-8-sig'))
      - shell: python
        run: |
          import pathlib, json, os
          for row in json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'asr-images.json').read_text())[10:20]: print(row)
      - shell: python
        run: |
          import pathlib, json, os
          for row in json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'asr-images.json').read_text())[20:]: print(row)
      - run: gh run rerun 41815753403 --failed --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
