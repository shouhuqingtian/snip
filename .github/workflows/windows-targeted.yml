name: Run a targeted Windows regression
on:
  push:
    branches: [hold-to-dictate]
    paths: ['src/**', 'tests/**', '.github/workflows/windows-targeted.yml']
  workflow_dispatch:
    inputs:
      check:
        type: choice
        options: [voice-input, toolbar-drag, clipboard, chrome, enhanced-ocr, editor-zoom, manual-preview, window-placement, text-ui, ui-gallery, hotkey, annotation-ui, editor-interaction, smart-selection, inline-text, capture-feedback, image-clipboard, desktop-scroll, configuration-transfer, image-text-selection, account-sync, annotation-style]
        default: clipboard
        required: true
      rounds:
        type: number
        default: 3
        required: true
permissions:
  contents: read
jobs:
  targeted:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Compile and prepare stack diagnostics
        shell: pwsh
        run: |
          dotnet build Snip.sln -c Release --maxcpucount:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tool install dotnet-stack --version 8.0.547301 --tool-path artifacts/check-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SNIP_CHECK_STACK_TOOL=$PWD/artifacts/check-tools/dotnet-stack.exe" | Add-Content $env:GITHUB_ENV
      - name: Run selected real desktop scenario
        shell: pwsh
        env:
          CHECK: ${{ inputs.check || 'voice-input' }}
          ROUNDS: ${{ inputs.rounds || 5 }}
        run: |
          $flag = switch ($env:CHECK) { 'voice-input' { '--voice-input' }; 'toolbar-drag' { '--toolbar-drag' }; 'clipboard' { '--clipboard-ui' }; 'chrome' { '--chrome' }; 'enhanced-ocr' { '--enhanced-ocr' }; 'editor-zoom' { '--editor-zoom' }; 'manual-preview' { '--manual-preview' }; 'window-placement' { '--window-placement' }; 'text-ui' { '--text-ui' }; 'ui-gallery' { '--ui-gallery' }; 'hotkey' { '--hotkey' }; 'annotation-ui' { '--annotation-ui' }; 'editor-interaction' { '--editor-performance' }; 'smart-selection' { '--smart-selection' }; 'inline-text' { '--inline-text' }; 'capture-feedback' { '--capture-feedback' }; 'image-clipboard' { '--image-clipboard' }; 'desktop-scroll' { '--desktop-scroll' }; 'configuration-transfer' { '--configuration-transfer' }; 'image-text-selection' { '--image-text-selection' }; 'account-sync' { '--account-sync' }; 'annotation-style' { '--annotation-style' }; default { throw 'Unsupported check.' } }
          $rounds = [Math]::Clamp([int]$env:ROUNDS,1,5)
          New-Item -ItemType Directory -Path artifacts/validation -Force | Out-Null
          foreach ($round in 1..$rounds) {
            Write-Output "Targeted $($env:CHECK) process round $round"
            $log = "artifacts/validation/targeted-$($env:CHECK)-$round.log"
            if ($env:CHECK -eq 'editor-interaction') {
              # Match Validate.ps1: native input and performance fixtures own separate STA processes.
              dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build *> $log
              $checkExit = $LASTEXITCODE
              if ($checkExit -eq 0) {
                dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- $flag *>> $log
                $checkExit = $LASTEXITCODE
              }
            } else {
              dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- $flag *> $log
              $checkExit = $LASTEXITCODE
              if ($env:GITHUB_EVENT_NAME -eq 'push' -and $checkExit -eq 0) {
                # Preserve the existing self-capture/shortcut scenarios alongside
                # the new global voice shortcut on every feature-branch round.
                dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --hotkey *>> $log
                $checkExit = $LASTEXITCODE
              }
            }
            Get-Content $log | Write-Output
            if ($env:CHECK -eq 'chrome') {
              foreach ($metric in @('manual-chrome-scroll-speed', 'manual-chrome-responsiveness')) {
                $metricPath = "artifacts/validation/$metric.json"
                if (Test-Path $metricPath) {
                  $summary = (Get-Content $metricPath -Raw | ConvertFrom-Json | ConvertTo-Json -Compress).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
                  Write-Output "::notice title=$metric round $($round)::$summary"
                }
              }
            }
            if ($checkExit -ne 0) {
              $detail = (Get-Content $log -Tail 25 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Output "::error title=Targeted desktop failure::$detail"
              exit $checkExit
            }
          }
      - name: Expose public voice fixture images for visual review
        if: success()
        shell: python
        run: |
          import os, base64, json
          from pathlib import Path
          rows=[]
          for name in ['58-voice-input-settings','59-voice-input-result','60-voice-input-recording']:
              path=Path('artifacts/validation/ui-previews')/(name+'.png')
              if not path.exists():
                  continue
              encoded=base64.b64encode(path.read_bytes()).decode('ascii')
              parts=[encoded[i:i+3000] for i in range(0,len(encoded),3000)]
              for i,part in enumerate(parts):
                  rows.append(f'::notice title=Voice fixture preview {name} {i+1}/{len(parts)}::{part}')
          (Path(os.environ['RUNNER_TEMP'])/'public-voice-previews.json').write_text(json.dumps(rows))
          for row in rows[:10]:
              print(row)
      - name: Expose remaining public voice fixture images
        if: success()
        shell: python
        run: |
          import os, json
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-voice-previews.json').read_text())
          for row in rows[10:20]:
              print(row)
      - name: Finish exposing public voice fixture images
        if: success()
        shell: python
        run: |
          import os, json
          from pathlib import Path
          rows=json.loads((Path(os.environ['RUNNER_TEMP'])/'public-voice-previews.json').read_text())
          for row in rows[20:]:
              print(row)
      - name: Summarize native check for review
        if: always()
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          Get-ChildItem artifacts/validation -Filter 'targeted-*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            "### $($_.Name)" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content $_.FullName -Tail 35 | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Targeted-Windows-validation
          path: |
            artifacts/validation/
            artifacts/chrome-check/
