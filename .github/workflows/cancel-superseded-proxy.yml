name: Cancel superseded proxy validation
on:
  push:
    branches: [system-proxy-compat]
    paths: [.github/workflows/cancel-superseded-proxy.yml]
permissions:
  contents: read
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: gh run cancel 41793015266 --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
