name: Windows build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - uses: actions/cache@v4
        with:
          path: .model-cache/translation
          key: translation-${{ hashFiles('src/Snip.Translation/translation-models.json') }}
      - name: Build, test and package
        shell: pwsh
        run: ./packaging/Publish.ps1 -Installer
      - name: Verify real offline translation models
        shell: pwsh
        run: dotnet run --project tests/Snip.Translation.Checks/Snip.Translation.Checks.csproj -c Release --no-build -- .model-cache/translation --install
      - name: Verify real Chrome page capture without ScrollPattern
        shell: pwsh
        timeout-minutes: 4
        run: dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --chrome
      - name: Verify native Windows OCR when language component is installed
        shell: pwsh
        timeout-minutes: 1
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --ocr
          if ($LASTEXITCODE -eq 2) {
            Write-Output '::warning::Native OCR unrun: this runner lacks the English OCR language component.'
            exit 0
          }
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chrome-capture-check
          path: artifacts/chrome-check/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: SelfSnip-win-x64
          path: |
            artifacts/自用截图-2.0.1-win-x64.zip
            artifacts/installer/*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
