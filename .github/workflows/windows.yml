name: Verify and deliver Windows preview
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/windows.yml'
      - 'Directory.Build.props'
      - 'Snip.sln'
      - 'global.json'
      - 'THIRD-PARTY-NOTICES.txt'
      - 'docs/使用说明.md'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - '.github/workflows/windows.yml'
      - 'Directory.Build.props'
      - 'Snip.sln'
      - 'global.json'
      - 'THIRD-PARTY-NOTICES.txt'
      - 'docs/使用说明.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Compile and verify core
        shell: pwsh
        run: ./packaging/Validate.ps1 -Scope Core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Core-validation
          path: artifacts/validation/
  windows:
    needs: core
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/cache@v4
        with:
          path: .model-cache/translation
          key: translation-${{ hashFiles('src/Snip.Translation/translation-models.json') }}
      - name: Compile Windows application
        shell: pwsh
        run: |
          dotnet build Snip.sln -c Release --maxcpucount:2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@v4
        with:
          path: .model-cache/ocr
          key: enhanced-ocr-${{ hashFiles('src/Snip.Ocr/OcrModelStore.cs') }}
      - name: Prepare bounded thread-stack capture for stalled desktop checks
        shell: pwsh
        run: |
          dotnet tool install dotnet-stack --version 8.0.547301 --tool-path artifacts/check-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "SNIP_CHECK_STACK_TOOL=$PWD/artifacts/check-tools/dotnet-stack.exe" | Add-Content $env:GITHUB_ENV
      - name: Verify enhanced bilingual OCR and isolated worker cleanup early
        shell: pwsh
        timeout-minutes: 6
        run: |
          New-Item -ItemType Directory -Path artifacts/validation -Force | Out-Null
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --enhanced-ocr *> artifacts/validation/early-enhanced-ocr.log
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0) {
            $detail = (Get-Content artifacts/validation/early-enhanced-ocr.log -Tail 25 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Enhanced OCR regression::$detail"
            exit $checkExit
          }
      - name: Verify shared online configuration and three OCR modes early
        shell: pwsh
        timeout-minutes: 3
        run: |
          New-Item -ItemType Directory -Path artifacts/validation -Force | Out-Null
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --online-settings *> artifacts/validation/early-ocr-modes.log
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0) {
            $detail = (Get-Content artifacts/validation/early-ocr-modes.log -Tail 25 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=OCR mode and shared settings regression::$detail"
            exit $checkExit
          }
      - name: Verify text clipboard contention separately
        shell: pwsh
        timeout-minutes: 2
        run: |
          foreach ($round in 1..2) {
            Write-Output "Clipboard process round $round"
            dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --clipboard-ui
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify live pin management and configurable shortcuts
        shell: pwsh
        timeout-minutes: 2
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --pins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify compact translation window placement separately
        shell: pwsh
        timeout-minutes: 2
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --window-placement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows English speech synthesis separately
        shell: pwsh
        timeout-minutes: 2
        run: |
          New-Item -ItemType Directory -Path artifacts/validation -Force | Out-Null
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --speech-native *> artifacts/validation/early-speech.log
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0 -and $checkExit -ne 2) {
            $detail = (Get-Content artifacts/validation/early-speech.log -Tail 20 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Windows speech synthesis::$detail"
            exit $checkExit
          }
          $global:LASTEXITCODE = 0
      - name: Verify long translation reading and speech controls
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --text-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render and inspect all themed windows
        shell: pwsh
        timeout-minutes: 2
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --ui-gallery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify editor responsiveness and allocations before browser checks
        shell: pwsh
        timeout-minutes: 3
        run: |
          New-Item -ItemType Directory -Path artifacts/validation -Force | Out-Null
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --editor-performance *> artifacts/validation/early-editor.log
          $checkExit = $LASTEXITCODE
          if ($checkExit -ne 0) {
            $detail = (Get-Content artifacts/validation/early-editor.log -Tail 30 | Out-String)
            $detail = $detail.Substring(0, [Math]::Min(6000, $detail.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Early editor regression::$detail"
            exit $checkExit
          }
      - name: Verify browser capture before model checks
        # Browser regressions should surface before model inference/download checks.
        # The complete desktop suite below also covers this scenario in its ordinary sequence.
        shell: pwsh
        timeout-minutes: 4
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --chrome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify complete UI, translation, browser and OCR suite before packaging
        shell: pwsh
        timeout-minutes: 18
        run: ./packaging/Validate.ps1 -Scope Desktop -NoBuild -FailFast
      - name: Surface interrupted check output in GitHub annotations
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem artifacts/validation -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object {
            $detail = (Get-Content $_.FullName -Tail 12 | Out-String)
            $detail = $detail.Substring(0, [Math]::Min(3000, $detail.Length)).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::notice title=Check output $($_.BaseName)::$detail"
          }
      - name: Publish tested portable application
        shell: pwsh
        run: |
          $channel = if ($env:GITHUB_REF -like 'refs/tags/v*') { 'Stable' } else { 'Preview' }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          if ($channel -eq 'Stable' -and $env:GITHUB_REF -ne "refs/tags/v$version") { throw 'Tag and project version disagree.' }
          ./packaging/Publish.ps1 -SkipChecks -Channel $channel
      - name: Smoke test the actual single-file EXE diagnostic export
        shell: pwsh
        run: |
          $report = Join-Path $PWD 'artifacts/validation/packaged-diagnostics.zip'
          $start = [System.Diagnostics.ProcessStartInfo]::new((Join-Path $PWD 'artifacts/portable/win-x64/Snip.exe'))
          $start.UseShellExecute = $false
          $start.ArgumentList.Add('--export-diagnostics'); $start.ArgumentList.Add($report)
          $process = [System.Diagnostics.Process]::Start($start)
          if (-not $process.WaitForExit(30000)) { $process.Kill($true); throw 'Packaged EXE timed out.' }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) { throw 'Packaged EXE diagnostic export failed.' }
          Expand-Archive $report 'artifacts/validation/packaged-report' -Force
          $environment = Get-Content 'artifacts/validation/packaged-report/environment.json' -Raw | ConvertFrom-Json
          if (-not $environment.Environment.Displays.Count -or $environment.Environment.AppVersion -notlike "*+$env:GITHUB_SHA") { throw 'Packaged version/display metadata incorrect.' }
      - name: Verify the published EXE sheep icon resources
        shell: pwsh
        run: |
          python packaging/CheckIcons.py --icon src/Snip.Infrastructure/Assets/sheep.ico --output artifacts/validation/exe-icon.json artifacts/portable/win-x64/Snip.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify OCR through the actual single-file EXE
        shell: pwsh
        timeout-minutes: 3
        run: |
          dotnet run --project tests/Snip.Windows.Checks/Snip.Windows.Checks.csproj -c Release --no-build -- --enhanced-ocr --worker-executable "$PWD/artifacts/portable/win-x64/Snip.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            artifacts/validation/
            artifacts/chrome-check/
      - uses: actions/upload-artifact@v4
        with:
          name: Tested-portable
          compression-level: 0
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
  deliver:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [core, windows]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Tested-portable
          path: artifacts
      - name: Build installer from the tested EXE for a version tag only
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          Expand-Archive "artifacts/self-snip-$version-win-x64.zip" 'artifacts/portable/win-x64' -Force
          ./packaging/Publish.ps1 -ReusePortable -Installer -Channel Stable
      - name: Verify install, sheep icons, installed EXE and uninstall on Windows
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        timeout-minutes: 4
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          New-Item -ItemType Directory artifacts/validation -Force | Out-Null
          try { ./packaging/CheckInstaller.ps1 -Installer "$PWD/artifacts/installer/SelfSnip-$version-Setup-x64.exe" *> artifacts/validation/installer-check.log }
          catch {
            $_ | Out-String | Add-Content artifacts/validation/installer-check.log
            $detail = (Get-Content artifacts/validation/installer-check.log -Tail 30 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Installer regression::$detail"
            throw
          }
          Compress-Archive artifacts/validation/installer-check.json,artifacts/validation/installer-icons.json artifacts/installer-verification.zip -Force
          $hash = (Get-FileHash artifacts/installer-verification.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  installer-verification.zip" | Add-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always() && startsWith(github.ref, 'refs/tags/v')
        with:
          name: Installer-validation
          path: artifacts/validation/
      - name: Publish directly downloadable GitHub release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $stable = $env:GITHUB_REF -like 'refs/tags/v*'
          $tag = if ($stable) { $env:GITHUB_REF_NAME } else { "preview-$($env:GITHUB_SHA.Substring(0,12))" }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $title = if ($stable) { "自用截图 $version" } else { "自用截图 $version 测试便携版 · $($env:GITHUB_SHA.Substring(0,7))" }
          @("源码提交：$env:GITHUB_SHA", '', '便携版解压后运行 Snip.exe；反馈问题时从主窗口或托盘导出诊断包。', '',
            '已通过 Core、Windows 界面/渲染、真实离线翻译和本地 Chrome 网页回归。原生英语 OCR 是否执行见 ZIP 内 validation/validation-desktop.json；Unrun 表示缺少语言组件。', '',
            '离线翻译使用唯一 Hy-MT2-1.8B Q3_K_M 模型，首次点击下载/修复模型获取约 951 MB 模型和约 20 MB CPU 推理器。旧 OPUS 模型不再使用。', '',
            '多屏混合 DPI、用户真实网页和系统分享目标仍需实机验收。附件包含便携版、完整源码和 SHA256 校验值；正式版本另含安装包。') |
            Set-Content artifacts/release-notes.md -Encoding utf8
          $assets = @(Get-ChildItem artifacts -File -Filter '*.zip' | ForEach-Object FullName) + @((Join-Path $PWD 'artifacts/SHA256SUMS.txt'))
          if ($stable) { $assets += @(Get-ChildItem artifacts/installer -File -Filter '*.exe' | ForEach-Object FullName) }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            $arguments = @('release','create',$tag) + $assets + @('--repo',$env:GITHUB_REPOSITORY,'--target',$env:GITHUB_SHA,'--title',$title,'--notes-file','artifacts/release-notes.md')
            if (-not $stable) { $arguments += @('--prerelease','--latest=false') }
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Download: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$tag" | Add-Content $env:GITHUB_STEP_SUMMARY
