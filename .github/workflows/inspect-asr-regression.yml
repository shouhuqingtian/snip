name: Inspect failed ASR fixture
on:
  push:
    branches: [faster-domestic-asr]
    paths: [.github/workflows/inspect-asr-regression.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: gh run download 41814389633 --repo "$GITHUB_REPOSITORY" --name Targeted-Windows-validation --dir fixture
        env:
          GH_TOKEN: ${{ github.token }}
      - shell: python
        run: |
          import json, pathlib
          for p in pathlib.Path('fixture').rglob('targeted-voice-input-*.log'):
              text=p.read_text(encoding='utf-8-sig')
              lines=text.splitlines()
              tail='\n'.join(lines[-12:])
              print('::error title=ASR fixture failure detail::'+tail.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for p in pathlib.Path('fixture').rglob('voice-target-performance.json'):
              print('::notice title=ASR target timings::'+p.read_text(encoding='utf-8-sig'))
