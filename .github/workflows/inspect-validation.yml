name: Inspect saved validation logs
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the saved Windows validation artifact
        required: true
        type: string
      artifact_name:
        description: Validation or OCR evaluation artifact to inspect
        default: Windows-validation
        required: true
        type: string
      previews:
        description: Public fixture preview group
        type: choice
        options: [image-text, annotations-and-sync, account-feedback]
        default: image-text
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: saved-validation
      - name: Surface saved check progress
        shell: python
        run: |
          from pathlib import Path
          for path in sorted(Path('saved-validation').rglob('*.json')):
              if path.name == 'validation-desktop.json':
                  value=path.read_text(encoding='utf-8-sig')
                  print('::notice title=Completed validation groups::'+value.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          for path in sorted(Path('saved-validation').rglob('*.log')):
              value='\n'.join(path.read_text(encoding='utf-8-sig',errors='replace').splitlines()[-12:])
              print('::notice title='+path.name+'::'+value[:5000].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))

      - name: Surface generated OCR fixture details
        shell: python
        run: |
          import json, statistics
          from pathlib import Path
          for name in ['native-windows.json','dotnet-PP-OCRv6-tiny.json','dotnet-PP-OCRv6-small.json','dotnet-PP-OCRv6-small-bounded.json']:
              for path in Path('saved-validation').rglob(name):
                  data=json.loads(path.read_text(encoding='utf-8-sig'))
                  rows=[r for r in data['Rows'] if r['Outcome']=='Measured']
                  failures=[{k:r[k] for k in ['Name','Expected','Actual','Errors']} for r in rows if not r['Exact']]
                  value=json.dumps({'engine':data['Engine'],'load_ms':data.get('LoadMs'),'peak_mib':data['PeakWorkingSetMiB'],'cold_to_first_ms':data.get('LoadMs',0)+(rows[0]['FirstMs'] if rows else 0),
                      'normal_warm_median_ms':statistics.median(r['WarmMeanMs'] for r in rows if r['Name'] not in ['4k-form','long-page']) if rows else None,
                      'normal_working_set_mib':max((r.get('WorkingSetMiB',0) for r in rows if r['Name'] not in ['4k-form','long-page']),default=0),
                      'exact':sum(r['Exact'] for r in rows),'measured':len(rows),'unrun':len(data['Rows'])-len(rows),'failures':failures},ensure_ascii=False)
                  print('::notice title=OCR details '+name+'::'+value.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))

      - name: Surface public Chrome fixture diagnostics
        shell: python
        run: |
          import json, base64
          from pathlib import Path
          for path in Path('saved-validation').rglob('events.jsonl'):
              if 'chrome-check' not in path.parts:
                  continue
              rows=[json.loads(line) for line in path.read_text(encoding='utf-8-sig').splitlines() if line.strip()]
              rows=[{'stage':r['Stage'],'fields':r['Fields'],'elapsed':r.get('TimestampUtc')} for r in rows if r['Stage'] in ['first-frame','viewport-found','scroll-interface','wheel-settled','overlap-match','position-fallback','failed']]
              value=json.dumps(rows[-30:],ensure_ascii=False)
              print('::notice title=Public Chrome fixture stages::'+value.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A'))
          for path in Path('saved-validation').rglob('initial.png'):
              if 'chrome-check' in path.parts and path.stat().st_size<3500:
                  print('::notice title=Public Chrome initial image::'+base64.b64encode(path.read_bytes()).decode())

      - name: Prepare public preview inspection
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Surface bounded public fixture previews
        shell: python
        env:
          PREVIEW_GROUP: ${{ inputs.previews }}
        run: |
          import base64, io, os
          from pathlib import Path
          from PIL import Image
          names = {'account-feedback': ['54-registration-success-sync-failure.png', '55-login-error.png'], 'annotations-and-sync': ['51-annotation-styles.png', '52-account-sync-login.png']}.get(os.environ.get('PREVIEW_GROUP'), ['49-image-text-selection.png', '50-pin-edit-text-selection.png'])
          for name in names:
              for path in Path('saved-validation').rglob(name):
                  original = Image.open(path).convert('RGB')
                  width = min(760, original.width)
                  while True:
                      thumbnail = original.resize((width, round(original.height * width / original.width)))
                      output = io.BytesIO()
                      thumbnail.save(output, format='JPEG', quality=45, optimize=True)
                      if len(output.getvalue()) <= 10000 or width <= 240:
                          break
                      width = round(width * .85)
                  encoded = base64.b64encode(output.getvalue()).decode()
                  for index, offset in enumerate(range(0, len(encoded), 3500)):
                      print('::notice title=Image text preview '+name.replace('.png','.jpg')+' part '+str(index).zfill(2)+'::'+encoded[offset:offset+3500])
