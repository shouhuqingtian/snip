name: Diagnose the tested Windows installer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the tested portable artifact
        required: true
        type: string
      publish:
        description: Publish only after the complete installer check passes
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  installer:
    permissions:
      contents: write
      actions: read
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retain the current independent validation tool
        shell: pwsh
        run: Copy-Item packaging/CheckInstaller.ps1 "$env:RUNNER_TEMP/CheckInstaller.ps1"
      - uses: actions/checkout@v4
        with:
          ref: v2.0.34
      - uses: actions/download-artifact@v4
        with:
          name: Tested-portable
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Rebuild only the installer around the validated EXE
        shell: pwsh
        run: |
          choco install nsis --no-progress --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          Expand-Archive "artifacts/自用截图-$version-win-x64.zip" artifacts/portable/win-x64
          ./packaging/Publish.ps1 -ReusePortable -Installer -Channel Stable
      - name: Surface complete install regression errors
        shell: pwsh
        run: |
          New-Item -ItemType Directory artifacts/validation -Force | Out-Null
          try {
            & "$env:RUNNER_TEMP/CheckInstaller.ps1" -RepositoryRoot "$PWD" -Installer "$PWD/artifacts/installer/SelfSnip-2.0.34-Setup-x64.exe" *> artifacts/validation/installer-check.log
          } catch {
            $_ | Out-String | Add-Content artifacts/validation/installer-check.log
            $detail = (Get-Content artifacts/validation/installer-check.log -Tail 30 | Out-String).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Actual installer regression::$detail"
            throw
          }
          Compress-Archive artifacts/validation/installer-check.json,artifacts/validation/installer-icons.json artifacts/installer-verification.zip -Force
          $hash = (Get-FileHash artifacts/installer-verification.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  installer-verification.zip" | Add-Content artifacts/SHA256SUMS.txt -Encoding utf8
      - name: Publish the validated formal-tag installer
        if: inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub sanitizes the original Chinese asset name. Use a stable ASCII download name.
          Rename-Item 'artifacts/自用截图-2.0.34-win-x64.zip' 'self-snip-2.0.34-win-x64.zip'
          $assets = @(Get-ChildItem artifacts -File -Filter '*.zip' | ForEach-Object FullName) + @((Join-Path $PWD 'artifacts/SHA256SUMS.txt')) + @(Get-ChildItem artifacts/installer -File -Filter '*.exe' | ForEach-Object FullName)
          $assets | Where-Object { [IO.Path]::GetFileName($_) -ne 'SHA256SUMS.txt' } | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), [IO.Path]::GetFileName($_) } | Set-Content artifacts/SHA256SUMS.txt -Encoding utf8
          'Validated application commit: acf73474bef8113a8172d5bc2e84b1dc732b5325. Installer reuses the tested portable EXE. Current independent installer validation checks normalized Windows paths. Full release notes will be added after asset verification.' | Set-Content artifacts/release-notes.md -Encoding utf8
          gh release view v2.0.34 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { gh release upload v2.0.34 @assets --repo $env:GITHUB_REPOSITORY --clobber }
          else { gh release create v2.0.34 @assets --repo $env:GITHUB_REPOSITORY --verify-tag --title '自用截图 2.0.34' --notes-file artifacts/release-notes.md }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Installer-debug
          path: artifacts/validation/
