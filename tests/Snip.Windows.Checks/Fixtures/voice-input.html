<!doctype html><meta charset="utf-8"><title>Public voice fixture</title>
<style>body{font:20px sans-serif;margin:24px}textarea,[contenteditable]{display:block;width:90%;min-height:100px;border:2px solid #078568;padding:12px;margin:16px 0}</style>
<h1>Public voice input fixture</h1>
<textarea id="one" aria-label="Public textarea"></textarea>
<div id="two" contenteditable="true" role="textbox" aria-label="Public contenteditable" aria-multiline="true" tabindex="0"></div>
<div id="three" contenteditable="true" class="tiptap ProseMirror" tabindex="0"><p><br></p></div>
<div id="four" contenteditable="plaintext-only" tabindex="0"></div>
<div id="five" role="document" aria-readonly="true" tabindex="0">PUBLIC READONLY</div>
<input id="six" type="password" aria-label="Public password">
<textarea id="seven" aria-label="Original field">PUBLIC ORIGINAL</textarea>
<textarea id="eight" aria-label="Other field">PUBLIC OTHER</textarea>
<script>
let submitted=false;
for (const [id,tag] of [['five','FIVE'],['six','SIX'],['seven','SEVEN'],['eight','EIGHT']]) { const e=document.getElementById(id); e.addEventListener('focus',()=>document.title='Public voice fixture | '+tag); e.addEventListener('input',()=>document.title='Public voice fixture | BADINPUT'); }
document.addEventListener('keydown',e=>{if(e.key==='Enter')submitted=true});
one.addEventListener('focus',()=>document.title='Public voice fixture | ONE');
two.addEventListener('focus',()=>document.title='Public voice fixture | TWO');
three.addEventListener('focus',()=>document.title='Public voice fixture | THREE');
four.addEventListener('focus',()=>document.title='Public voice fixture | FOUR');
three.addEventListener('input',()=>document.title='Public voice fixture | '+(three.textContent==='PUBLIC rich editor'&&!submitted?'THREEOK':'THREEEDIT'));
four.addEventListener('input',()=>document.title='Public voice fixture | '+(four.textContent==='PUBLIC plain editor'&&!submitted?'FOUROK':'FOUREDIT'));
one.addEventListener('input',()=>document.title='Public voice fixture | '+(one.value==='PUBLIC 中文 voice'&&!submitted?'ONEOK':'ONEEDIT'));
two.addEventListener('input',()=>document.title='Public voice fixture | '+(two.textContent==='PUBLIC English words'&&!submitted?'TWOOK':'TWOEDIT'));
window.addEventListener('load',()=>one.focus());
</script>
